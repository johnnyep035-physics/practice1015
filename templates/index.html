<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- 引入 Google Fonts 微軟正黑體/蘋方替代字體與漂亮英文字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-sub: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.2;
            background: linear-gradient(45deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            font-size: 1.05rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        #dynamic-msg {
            margin-top: 14px;
            font-size: 0.95rem;
            color: #059669;
            min-height: 24px;
            font-weight: 500;
        }

        footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Python Flask 網頁開發</span>
        <h1>{{ heading }}</h1>
        <p class="desc">{{ message }}</p>

        <div class="action-card">
            <button class="btn" onclick="handleClick()">點擊互動體驗</button>
            <div id="dynamic-msg"></div>
        </div>

        <footer>
            交大 AI 商業數據分析班 &bull; 練習專案
        </footer>
    </div>

    <script>
        let count = 0;
        function handleClick() {
            count++;
            const msgEl = document.getElementById('dynamic-msg');
            const now = new Date().toLocaleTimeString('zh-TW');
            msgEl.textContent = `🎉 恭喜！您已點擊了 ${count} 次（最後點擊時間：${now}）`;
        }
    </script>
</body>
</html>
