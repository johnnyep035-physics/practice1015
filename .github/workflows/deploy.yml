name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI 階段：自動化測試與代碼檢查 (Continuous Integration)
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest test_app.py

  # ==========================================
  # 2. CD 階段：部署至 Render (Continuous Deployment)
  # ==========================================
  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::未設定 GitHub Secret 'RENDER_DEPLOY_HOOK_URL'！"
            echo "請前往 GitHub 專案 Settings -> Secrets and variables -> Actions 加入 RENDER_DEPLOY_HOOK_URL。"
            exit 1
          fi

          echo "🚀 正在觸發 Render 部署 Hook..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS/d')

          echo "回應內容: $body"
          echo "HTTP 狀態碼: $http_status"

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Render 部署指令已成功發送！"
          else
            echo "❌ 觸發 Render 部署失敗，HTTP 狀態碼: $http_status"
            exit 1
          fi
